<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Dynamic Designing</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #050508;
        color: #f1f1f1;
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .container {
        max-width: 540px;
      }
      .badge {
        display: inline-block;
        font-family: 'Space Grotesk', sans-serif;
        font-size: 13px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #4f8ef7;
        background: rgba(79, 142, 247, 0.1);
        border: 1px solid rgba(79, 142, 247, 0.25);
        padding: 6px 16px;
        border-radius: 9999px;
        margin-bottom: 24px;
      }
      h1 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: clamp(72px, 15vw, 120px);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, #ffffff 0%, rgba(255, 255, 255, 0.4) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 12px;
      }
      h2 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 24px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 16px;
      }
      p {
        color: rgba(255, 255, 255, 0.5);
        font-size: 16px;
        line-height: 1.6;
        margin-bottom: 32px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(135deg, #4f8ef7 0%, #8b5cf6 100%);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 14px 32px;
        border-radius: 9999px;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 0 25px rgba(79, 142, 247, 0.35);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 0 35px rgba(79, 142, 247, 0.55);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="badge">Error 404</div>
      <h1>404</h1>
      <h2>Page Not Found</h2>
      <p>The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
